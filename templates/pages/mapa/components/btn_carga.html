<div
    class="
        flex items-center justify-between gap-4
        max-[1200px]:flex-col
        max-[1200px]:items-stretch
    "
>

    <!-- BOTÓN CARGAR EXCEL -->

    <div
        x-data="{ modelOpen: false }"
        id="addModal"
        class="max-[1200px]:w-full"
    >

        <button
            {% if not evento_predeterminado %}
                disabled
            {% endif %}

            @click="modelOpen = !modelOpen"
            class="
                btn_plus_excel
                flex w-36 items-center justify-center
                space-x-2 rounded-md
                border border-solid border-white
                bg-indigo-500
                px-3 py-2
                text-sm text-white
                transition-colors
                hover:bg-indigo-600
                focus:outline-none
                focus:ring
                focus:ring-indigo-300
                focus:ring-opacity-50
                max-[1200px]:w-full
            "
            id="openModalButton"
            onclick="abrir_modal_documento(
                '{% url 'MapaCarga' %}',
                'modalBodyExcel'
            )"
        >

            <span>
                Cargar Datos
            </span>

            <svg
                class="h-5 w-5"
                viewBox="0 0 20 20"
                fill="currentColor"
            >
                <path
                    fill-rule="evenodd"
                    d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z"
                    clip-rule="evenodd"
                />
            </svg>

        </button>

        {% include "components/modal/modal.html" with modal_id="containerModalExcel" modal_body_id="modalBodyExcel" modal_title="Carga de Archivo" %}

    </div>


    {% if request.resolver_match.url_name != 'MapaVista' %}

    <div
        class="
            flex items-center gap-4
            max-[1200px]:w-full
            max-[900px]:flex-col
        "
    >
        {% if eventos %}
            <!-- SELECTOR EVENTO -->

            <div
                class="
                    flex items-center gap-3
                    rounded-lg
                    border border-gray-700
                    bg-gray-800
                    px-4 py-1
                    shadow-sm
                    max-[1200px]:flex-1
                    max-[900px]:w-full
                    max-[900px]:justify-between
                "
            >

                <label
                    for="filtro-evento"
                    class="whitespace-nowrap text-sm font-medium text-gray-200"
                >
                    Evento:
                </label>

                <select
                    id="filtro-evento"
                    class="
                        max-w-[260px]
                        cursor-pointer
                        rounded-md
                        border border-gray-600
                        bg-gray-700
                        px-4 py-2
                        text-sm
                        text-gray-200
                        outline-none
                        focus:border-indigo-500
                        focus:ring-2
                        focus:ring-indigo-200
                        max-[900px]:max-w-none
                        max-[900px]:flex-1
                    "
                >

                    {% for evento in eventos %}

                        <option
                            value="{{ evento.id }}"

                            {% if evento_activo and evento_activo.id == evento.id %}
                                selected
                            {% endif %}

                            {% if evento_predeterminado and evento_predeterminado.id == evento.id %}
                                data-activo="1"
                            {% else %}
                                data-activo="0"
                            {% endif %}
                        >

                            {{ evento.nombre }}

                            {% if evento_predeterminado and evento_predeterminado.id == evento.id %}
                                — ACTIVO
                            {% endif %}

                        </option>

                    {% endfor %}

                </select>

            </div>
          {% else %}
              <div
                  class="
                      rounded-lg
                      border border-amber-500/30
                      bg-amber-500/10
                      px-4 py-2
                      text-sm
                      text-amber-300
                  "
              >
                  Aún no existen eventos.
              </div>

          {% endif %}


        <!-- SELECTOR DÍAS -->

        <div
            class="
                flex items-center gap-3
                rounded-lg
                border border-gray-700
                bg-gray-800
                px-4 py-1
                shadow-sm
                max-[1200px]:flex-1
                max-[900px]:w-full
                max-[900px]:justify-between
            "
        >

            <label
                for="filtro-dias"
                class="whitespace-nowrap text-sm font-medium text-gray-200"
            >
                Mostrar:
            </label>

            <select
                id="filtro-dias"
                class="
                    cursor-pointer
                    rounded-md
                    border border-gray-600
                    bg-gray-700
                    px-4 py-2
                    text-sm
                    text-gray-200
                    outline-none
                    focus:border-indigo-500
                    focus:ring-2
                    focus:ring-indigo-200
                "
            >


                <option
                    value="todo"
                    {% if dias_filtro == "todo" %}
                        selected
                    {% endif %}
                >
                    Todo el evento
                </option>
                
                <option
                    value="7"
                    {% if dias_filtro == "7" %}
                        selected
                    {% endif %}
                >
                    Últimos 7 días
                </option>

                <option
                    value="1"
                    {% if dias_filtro == "1" %}
                        selected
                    {% endif %}
                >
                    Solo hoy
                </option>

            </select>

        </div>

    </div>

    {% endif %}

</div>
