{% load static %} 
{% load static tailwind_tags %}

<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block head_title %} {% endblock head_title %}</title>
    {% tailwind_css %}
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
    <link rel="stylesheet" href="{% static 'css/mensajes.css' %}">
    {% block extra_css %} {% endblock extra_css %}
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.5/purify.min.js"  referrerpolicy="no-referrer"></script>
    <script defer src="{% static "js/mensajes.js" %}"></script>
    {% block javascript %} {% endblock javascript %}
  </head>
  <body
    class="
        min-h-dvh
        {% if request.resolver_match.url_name == 'MapaVista' %}
            bg-white text-gray-900
        {% else %}
            bg-gray-900/90 text-white
        {% endif %}
    "
    >
    
    {% block content %} {% endblock content %}
    
  </body>
</html>
